[package]
name = "writs-cli"
description = "Command-line interface of writs."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# The package is `<name>-cli` because the library owns `<name>`; the command is still `<name>`.
[[bin]]
name = "writs"
path = "src/main.rs"
# Shares its name with the library, so `cargo doc` would overwrite the library docs (cargo#6313).
doc = false

[dependencies]
writs.workspace = true
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

# dist skips `publish = false` packages unless told otherwise.
[package.metadata.dist]
dist = true
# Homebrew formula named after the command, not the package.
formula = "writs"

[package.metadata.wix]
upgrade-guid = "F069FC06-1AA8-4A7B-8077-5383B0D86069"
path-guid = "75F547C3-A909-4B60-AF52-D5B370C06C47"
license = false
eula = false
