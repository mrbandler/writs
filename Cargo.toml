[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Michael Baudler <me@mrbandler.dev>"]
license = "MIT"
repository = "https://github.com/mrbandler/writs"
homepage = "https://github.com/mrbandler/writs"
readme = "README.md"

[workspace.dependencies]
thiserror = "2.0"
miette = { version = "7.6", default-features = false, features = ["derive"] }
writs = { path = "crates/writs", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Used by dist for release binaries.
[profile.dist]
inherits = "release"
